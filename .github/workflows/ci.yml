name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json's `engines` promises node >= 20.18.0, so verify the
        # floor and the current LTS releases rather than the floor alone.
        node-version: ['20.18.0', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint --if-present
      # Regenerate src/generated/schema-types.ts from the vendored SDL and fail
      # on any diff. This runs on EVERY pull request, not only when
      # schema.graphql changes, because the drift being guarded against is a
      # hand-written type moving away from an unchanged schema.
      - name: Types match the vendored schema
        run: npm run codegen:check
      # `npm run build` type-checks src/generated/conformance.ts, which asserts
      # every hand-written type is exactly equal to its generated counterpart.
      - run: npm run build
      - run: npm run test:unit
